<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS HUD</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
background:#02070d;
color:#00eaff;
font-family:Arial, sans-serif;
overflow:hidden;
text-align:center;
}

h1{
font-size:45px;
letter-spacing:12px;
text-shadow:0 0 25px #00eaff;
margin-top:40px;
}

button{
background:transparent;
color:#00eaff;
border:2px solid #00eaff;
padding:15px 45px;
font-size:18px;
border-radius:5px;
box-shadow:0 0 20px #00eaff;
}

button:active{
background:#00eaff;
color:#000;
}


#hud{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#02070d;
padding-top:30px;
}


.radar{
width:220px;
height:220px;
border:3px solid #00eaff;
border-radius:50%;
margin:30px auto;
box-shadow:0 0 40px #00eaff;
animation:spin 5s linear infinite;
display:flex;
align-items:center;
justify-content:center;
}


.core{
width:70px;
height:70px;
border:3px solid #00eaff;
border-radius:50%;
box-shadow:0 0 30px #00eaff;
animation:pulse 2s infinite;
}


.panel{
margin:15px;
padding:15px;
border:1px solid #00eaff;
box-shadow:0 0 15px #00eaff;
font-size:16px;
}


.loading{
animation:blink 1s infinite;
}


@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


@keyframes pulse{

50%{
transform:scale(1.2);
}

}


@keyframes blink{

50%{
opacity:0.3;
}

}

</style>

</head>


<body>


<div id="start">

<h1>JARVIS</h1>

<p>AI SYSTEM READY</p>

<button onclick="activateJarvis()">
ACTIVATE
</button>

</div>



<div id="hud">

<h1>JARVIS ONLINE</h1>

<div class="radar">

<div class="core"></div>

</div>


<div class="panel">
SYSTEM STATUS: ONLINE<br>
AI CORE: ACTIVE<br>
VOICE MODULE: READY<br>
SECURITY: ENABLED
</div>


<div class="panel loading">
SCANNING...<br>
TARGETS: NONE<br>
NETWORK: CONNECTED
</div>


</div>



<script>

function activateJarvis(){

document.getElementById("start").style.display="none";

document.getElementById("hud").style.display="block";

}

</script>


</body>
</html>
