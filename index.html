<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS HUD</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #02050a;
  color: #00eaff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.hud {
  text-align: center;
}

.circle {
  width: 220px;
  height: 220px;
  border: 3px solid #00eaff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 30px #00eaff;
  animation: pulse 2s infinite;
}

.core {
  width: 80px;
  height: 80px;
  border: 3px solid #00eaff;
  border-radius: 50%;
  box-shadow: 0 0 20px #00eaff;
}

h1 {
  margin-top: 40px;
  letter-spacing: 8px;
}

.status {
  margin-top: 15px;
  opacity: 0.8;
}

button {
  margin-top: 30px;
  background: transparent;
  color: #00eaff;
  border: 2px solid #00eaff;
  padding: 12px 30px;
  border-radius: 30px;
  font-size: 16px;
}

button:hover {
  background: #00eaff;
  color: black;
}

@keyframes pulse {
  50% {
    transform: scale(1.08);
  }
}
</style>

</head>

<body>

<div class="hud">

<div class="circle">
  <div class="core"></div>
</div>

<h1>JARVIS</h1>

<div class="status">
SYSTEM ONLINE
</div>

<button>
ACTIVATE
</button>

</div>

</body>
</html>
