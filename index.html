<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>
body{
background:#02070d;
color:#00eaff;
font-family:Arial;
text-align:center;
}

h1{
font-size:45px;
letter-spacing:10px;
}

.core{
width:200px;
height:200px;
border:3px solid #00eaff;
border-radius:50%;
margin:40px auto;
animation:spin 5s linear infinite;
box-shadow:0 0 30px #00eaff;
}

button{
padding:15px 40px;
background:none;
border:2px solid #00eaff;
color:#00eaff;
font-size:18px;
}

.panel{
border:1px solid #00eaff;
padding:15px;
margin:20px;
}

#hud{
display:none;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}
</style>

</head>

<body>

<h1>JARVIS</h1>

<div class="core"></div>

<button onclick="activateJarvis()">ACTIVATE</button>

<div id="hud">

<h2>HUD ONLINE</h2>

<div class="panel">
AI CORE: ACTIVE<br>
SYSTEMS: ONLINE<br>
VOICE: READY
</div>

<div class="panel">
SCANNING...<br>
NETWORK CONNECTED
</div>

</div>

<script>

function activateJarvis(){
document.getElementById("hud").style.display="block";
}

</script>

</body>
</html>
